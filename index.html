<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание МФ МГСУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #64b5f6;
            font-weight: 500;
        }
        .day-title { font-size: 24px; font-weight: bold; color: var(--tg-theme-text-color, #fff); margin-bottom: 5px; }
        .subtitle { color: #7f91a4; font-size: 14px; margin-bottom: 20px; }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .time { color: #64b5f6; font-weight: bold; font-size: 14px; }
        .subject { font-size: 16px; font-weight: 500; }
        .details { color: #7f91a4; font-size: 14px; display: flex; flex-direction: column; gap: 4px;}
        .type { align-self: flex-end; background: var(--tg-theme-bg-color, #17212b); padding: 4px 8px; border-radius: 6px; font-size: 12px; color: #64b5f6; }
    </style>
</head>
<body>
    <div class="header">
        <div id="btn-yesterday" style="cursor: pointer;">← Вчера</div>
        <div id="today-badge" style="background: #232e3c; padding: 5px 15px; border-radius: 15px; cursor: pointer;">Сегодня</div>
        <div id="btn-tomorrow" style="cursor: pointer;">Завтра →</div>
    </div>

    <div class="day-title" id="day-title">Загрузка...</div>
    <div class="subtitle" id="subtitle"></div>

    <div id="schedule-container"></div>

    <script>
        // СЮДА МЫ ВСТАВИМ ССЫЛКУ ОТ AMVERA ПОЗЖЕ
        const API_URL = "https://mgsu-api1-dkan7808.msk1.amvera.tech"; 
        
        let currentDate = new Date();
        
        // Функция для расчета недели (упрощенная)
        function getWeekType(date) {
            const startDate = new Date(2026, 8, 7); // 7 сентября 2026
            const diffTime = date - startDate;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const weekIndex = Math.floor(diffDays / 7);
            return (weekIndex % 2 === 0) ? "even" : "odd";
        }

        async function loadSchedule(date) {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '<div style="text-align:center; padding: 20px;">Загрузка...</div>';
            
            let day = date.getDay();
            if (day === 0) day = 7; 
            
            // Если выходной (0=Пн, 5=Сб, 6=Вс), показываем Вторник
            let targetDay = day;
            if (day === 1 || day === 6 || day === 0) {
                targetDay = 2; // Вторник
            }

            const weekType = getWeekType(date);
            const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
            const daysNames = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
            
            document.getElementById('day-title').innerText = `${daysNames[targetDay - 1]}, ${date.getDate()} ${months[date.getMonth()]}`;
            document.getElementById('subtitle').innerText = weekType === "even" ? "Четная неделя" : "Нечетная неделя";

            try {
                const response = await fetch(`${API_URL}/api/schedule?day=${targetDay}&week_type=${weekType}`);
                const data = await response.json();
                
                container.innerHTML = '';
                if (data.schedule.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding: 20px; color: #7f91a4;">Пар нет. Отдыхай! 🎉</div>';
                    return;
                }

                data.schedule.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="time">${index + 1}. ${item.time}</div>
                            <div class="type">${item.type || ''}</div>
                        </div>
                        <div class="subject">${item.name}</div>
                        <div class="details">
                            <span>📍 ${item.room || 'Не указан'}</span>
                            <span>👤 ${item.teacher || 'Не указан'}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<div style="text-align:center; padding: 20px; color: red;">Ошибка загрузки сервера</div>';
            }
        }

        document.getElementById('btn-yesterday').onclick = () => { currentDate.setDate(currentDate.getDate() - 1); loadSchedule(currentDate); };
        document.getElementById('btn-tomorrow').onclick = () => { currentDate.setDate(currentDate.getDate() + 1); loadSchedule(currentDate); };
        document.getElementById('today-badge').onclick = () => { currentDate = new Date(); loadSchedule(currentDate); };

        // Инициализация Telegram Mini App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        loadSchedule(currentDate);
    </script>
</body>
</html>
